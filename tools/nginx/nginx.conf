# Reverse proxy in front of the app services. Almost everything goes to the
# frontend — the browser never talks to the backend directly anywhere in
# this app (every backend call goes through the frontend's own Route
# Handlers server-side, see frontend/README.md's Auth model section), so
# the backend doesn't need to be reachable from the public internet at all
# EXCEPT for one thing: /webhooks/khqr/payment-confirm is called
# server-to-server by an external KHQR payment gateway, which obviously
# isn't going through the frontend's cookie-based session. That one path
# goes straight to the backend; everything else goes to the frontend.
events {}

http {
  upstream frontend {
    server sme-pos-frontend:3000;
  }

  upstream backend {
    server sme-pos-backend:8080;
  }

  server {
    listen 80;

    # Real client IP for RateLimitInterceptor once APP_TRUST_PROXY_HEADERS
    # is set on the backend — see that class's own comment for why it's
    # opt-in, not automatic just because nginx exists.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /webhooks/ {
      proxy_pass http://backend;
    }

    location / {
      proxy_pass http://frontend;
    }
  }

  # TLS deliberately not configured here — a real cert needs a real domain
  # name and either a purchased certificate or an ACME challenge (e.g.
  # certbot/Let's Encrypt), neither of which can exist for a
  # not-yet-deployed project. Add a second `server { listen 443 ssl; ... }`
  # block here (with `ssl_certificate`/`ssl_certificate_key` pointing at
  # real files, e.g. mounted from a `tools/nginx/certs/` volume) once this
  # is actually deployed somewhere with a domain — don't fake a
  # self-signed cert now just to make this look "done".
}
