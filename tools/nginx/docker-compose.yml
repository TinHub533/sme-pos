name: sme-pos-nginx

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sme-pos-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8000}:80"
    networks:
      - sme-pos-network

networks:
  sme-pos-network:
    external: true
    name: sme-pos-network
