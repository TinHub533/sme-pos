name: sme-pos-postgresql

services:
  postgres:
    image: postgres:16
    container_name: sme-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smepos}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - sme-pos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-smepos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sme-pos-network

networks:
  sme-pos-network:
    name: sme-pos-network

volumes:
  sme-pos-postgres-data:
    name: sme-pos-postgres-data
